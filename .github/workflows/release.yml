name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate, build and publish immutable version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Checkout supplies the push event's main snapshot; never walk back to
          # a version-file commit, which may be stale or from a merged branch.
          release_commit=$(git rev-parse HEAD)
          if [[ "$release_commit" != "${GITHUB_SHA:?}" ]]; then
            echo 'Checked-out commit does not match the push event SHA' >&2
            exit 1
          fi
          npm run check:generated
          npm test
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('config/version.json', 'utf8')).version")
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$ ]]
          tag="v$version"
          # Walk the first-parent history, never changing checkout. Every commit
          # since this version appeared must contain identical script bytes.
          # Continue past deleted version files to find the prior known version.
          in_current=true
          previous=''
          legacy_commit=''
          git rev-list --first-parent "$release_commit" > "$RUNNER_TEMP/release-history"
          while IFS= read -r commit; do
            candidate=''
            if git cat-file -e "$commit:config/version.json" 2>/dev/null; then
              candidate=$(git show "$commit:config/version.json" | node -e '
                const value = JSON.parse(require("node:fs").readFileSync(0, "utf8")).version;
                if (typeof value !== "string" || !/^\d{4}\.\d{2}\.\d{2}\.\d{4}$/.test(value)) throw Error("Invalid historical version file");
                process.stdout.write(value);
              ')
            fi
            if [[ "$in_current" == true && "$candidate" == "$version" ]]; then
              if ! git show "$commit:Google-Search-Redirect.js" > "$RUNNER_TEMP/history-script.js" ||
                 ! cmp -s Google-Search-Redirect.js "$RUNNER_TEMP/history-script.js"; then
                echo "Version conflict: userscript changed without a version increase" >&2
                exit 1
              fi
              continue
            fi
            in_current=false
            if [[ -n "$candidate" ]]; then
              previous="$candidate"
              break
            fi
            if [[ -z "$legacy_commit" ]] && git cat-file -e "$commit:Google-Search-Redirect.js" 2>/dev/null; then
              legacy_commit="$commit"
            fi
          done < "$RUNNER_TEMP/release-history"
          if [[ -z "$previous" && -n "$legacy_commit" ]]; then
            previous=$(git show "$legacy_commit:Google-Search-Redirect.js" | node -e '
              const text = require("node:fs").readFileSync(0, "utf8");
              const block = text.match(/^\/\/ ==UserScript==\r?$\n([\s\S]*?)^\/\/ ==\/UserScript==\r?$/m);
              const versions = block && [...block[1].matchAll(/^\/\/\s*@version\s+(\S+)\s*$/gm)];
              if (!versions || versions.length !== 1) throw Error("Cannot identify legacy userscript version");
              process.stdout.write(versions[0][1]);
            ')
          fi
          if [[ -n "$previous" ]]; then
            VERSION="$version" PREVIOUS="$previous" node -e '
              const a = process.env.VERSION, b = process.env.PREVIOUS;
              if (!/^\d+(?:\.\d+)*$/.test(b)) throw Error("Invalid previous numeric version");
              const x = a.split(".").map(BigInt), y = b.split(".").map(BigInt);
              const n = Math.max(x.length, y.length);
              let comparison = 0;
              for (let i = 0; i < n; i++) {
                const l = x[i] ?? 0n, r = y[i] ?? 0n;
                if (l !== r) { comparison = l > r ? 1 : -1; break; }
              }
              if (comparison <= 0) throw Error("Version must increase over previous history");
            '
          fi
          # The watermark is the highest already published date tag. Comparing
          # only the previous commit would let a failed downgrade be followed by
          # a slightly higher, still lower, version.
          git tag --list 'v*' | VERSION="$version" node -e '
            const parse = value => {
              const m = /^v(\d{4})\.(\d{2})\.(\d{2})\.(\d{2})(\d{2})$/.exec(value.trim());
              return m ? m.slice(1).map(BigInt) : null;
            };
            const compare = (x, y) => {
              for (let i = 0; i < 5; i++) if (x[i] !== y[i]) return x[i] > y[i] ? 1 : -1;
              return 0;
            };
            const current = parse("v" + process.env.VERSION);
            let max = null;
            for (const line of require("node:fs").readFileSync(0, "utf8").split("\n")) {
              const candidate = parse(line);
              if (candidate && (!max || compare(candidate, max) > 0)) max = candidate;
            }
            if (max && compare(current, max) < 0) {
              console.error("Version " + process.env.VERSION + " is lower than existing release tag v" + max.map(String).join("."));
              process.exit(1);
            }
          '
          if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            tagged=$(git rev-parse "refs/tags/${tag}^{commit}")
            # Older first-parent main tags are reusable only for identical
            # bytes (e.g. docs-only commits); never move or overwrite a tag.
            if ! git rev-list --first-parent "$release_commit" | grep -Fx "$tagged" >/dev/null; then
              echo "Version conflict: $tag is not on main's first-parent history" >&2
              exit 1
            fi
            if ! git show "refs/tags/$tag:Google-Search-Redirect.js" > "$RUNNER_TEMP/tagged-script.js" ||
               ! cmp -s Google-Search-Redirect.js "$RUNNER_TEMP/tagged-script.js"; then
              echo "Version conflict: $tag has different userscript content" >&2
              exit 1
            fi
          else
            git tag "$tag" "$release_commit"
            git push origin "refs/tags/$tag"
          fi
          # Treat only an explicit 404 as absent; auth/network failures are fatal.
          if gh api "repos/$GH_REPO/releases/tags/$tag" >"$RUNNER_TEMP/release.json" 2>"$RUNNER_TEMP/release.err"; then
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            if printf '%s\n' "$assets" | grep -Fx 'Google-Search-Redirect.js' >/dev/null; then
              mkdir -p "$RUNNER_TEMP/release-asset"
              gh release download "$tag" --pattern 'Google-Search-Redirect.js' --dir "$RUNNER_TEMP/release-asset"
              cmp Google-Search-Redirect.js "$RUNNER_TEMP/release-asset/Google-Search-Redirect.js"
            else
              gh release upload "$tag" Google-Search-Redirect.js
            fi
          else
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/release.err"; then
              cat "$RUNNER_TEMP/release.err" >&2
              exit 1
            fi
            gh release create "$tag" Google-Search-Redirect.js --verify-tag --title "$tag" --generate-notes
          fi
